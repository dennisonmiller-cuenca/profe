<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profe · Spanish practice</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:dark}body{background:#10141b;color:#f5f7fb;margin:0;padding:24px}main{max-width:650px;margin:7vh auto}h1{font-size:3rem;margin:0}p{line-height:1.6;color:#cbd5e1}input,button{font:inherit;padding:14px;border-radius:12px;margin:6px 4px 6px 0}input{background:#202734;color:white;border:1px solid #536072;max-width:90%}button{background:#f58220;color:#10141b;border:0;font-weight:700;cursor:pointer}button.secondary{background:#344155;color:white}button:disabled{opacity:.4}#teacher{font-size:1.45rem;line-height:1.5;margin-top:22px}#learner{color:#aab9ce;margin-top:14px}#practice{border:2px solid #f58220;background:#1c293b;padding:16px;border-radius:14px;margin-top:18px;box-shadow:0 4px 18px #0009}#practice h2{margin:0 0 8px;font-size:1.1rem}#phrase{font-size:1.6rem;font-weight:700;color:#fff;white-space:pre-wrap}#attempts{color:#fbbf24}#teacher{white-space:pre-wrap}.board-item{padding:12px 0;border-top:1px solid #526076}.board-item strong{display:block;color:#ffbf75;margin-bottom:5px}#boarditems{line-height:1.6}section{margin-top:30px}small{color:#aab9ce}
</style></head><body><div id="app">Loading Profe…</div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://byahpjoizwcwgccufisi.supabase.co','sb_publishable_l1IehA77G_uSWEtkqpBj3A_-LIIYv9g');
const app=document.querySelector('#app');

let profile,pc,dc,mic,sessionId,log=[];let activePhrase='',practiceAttempts=0,practiceCards=[];
const normalizePhrase=s=>String(s||'').toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zñ ]/g,' ').replace(/\s+/g,' ').trim();
const savePractice=()=>{if(profile)localStorage.setItem('profe-practice-'+profile.id,JSON.stringify(practiceCards.slice(-60)))};
function showPractice(){const el=document.querySelector('#phrase'),count=document.querySelector('#attempts');if(el)el.textContent=activePhrase||'Choose a phrase from Profe’s speech or type one below.';if(count)count.textContent=activePhrase?`${practiceAttempts} of 3–5 practice turns (minimum 3)`:'No phrase pinned yet';}
function pinPhrase(phrase){phrase=String(phrase||'').trim().slice(0,220);if(!phrase)return;activePhrase=phrase;const key=normalizePhrase(phrase);const existing=practiceCards.find(x=>x.key===key);practiceAttempts=existing?.attempts||0;if(!existing)practiceCards.push({key,phrase,attempts:0,lastPracticed:null,nextReview:null});savePractice();showPractice();}
function noteAttempt(transcript){if(!activePhrase)return;const key=normalizePhrase(activePhrase),spoken=normalizePhrase(transcript);const tokens=key.split(' ').filter(w=>w.length>2);if(!tokens.length||tokens.filter(w=>spoken.includes(w)).length/ tokens.length<0.65)return;const card=practiceCards.find(x=>x.key===key);if(!card)return;card.attempts++;practiceAttempts=card.attempts;card.lastPracticed=new Date().toISOString();card.nextReview=new Date(Date.now()+(card.attempts>=3?86400000:0)).toISOString();savePractice();showPractice();}

let boardItems=[];
function saveBoard(){if(profile)localStorage.setItem('profe-board-'+profile.id,JSON.stringify(boardItems.slice(-20)))}
function renderBoard(){const target=document.querySelector('#boarditems');if(!target)return;target.replaceChildren();if(!boardItems.length){target.textContent='Ask Profe to add phrases, vocabulary, conjugations or lesson tips here.';return}for(const item of boardItems){const block=document.createElement('div');block.className='board-item';const heading=document.createElement('strong');heading.textContent=item.title||item.type;const content=document.createElement('div');content.textContent=item.content;content.style.whiteSpace='pre-wrap';block.append(heading,content);target.append(block)}}
function updateBoard(args){const action=String(args.action||'add');if(action==='clear')boardItems=[];else if(action==='remove'){const title=String(args.title||'').toLowerCase();boardItems=boardItems.filter(x=>x.title.toLowerCase()!==title)}else if(['add','replace','keep'].includes(action)){const title=String(args.title||'Practice').slice(0,100),content=String(args.content||'').slice(0,1200),type=String(args.type||'phrase').slice(0,30);if(!content)return 'No board content provided';const item={title,content,type};const index=boardItems.findIndex(x=>x.title.toLowerCase()===title.toLowerCase());if(action==='replace')boardItems=[];if(index>=0&&action!=='replace')boardItems[index]=item;else boardItems.push(item);boardItems=boardItems.slice(-12);if(type==='phrase'&&content.length<220)pinPhrase(content)}saveBoard();renderBoard();return 'Lesson Board updated'}
const boardTool={type:'function',name:'update_lesson_board',description:'Update the visible Lesson Board below the live conversation. Use proactively for phrases, vocabulary, conjugations, pronunciation or tips. Follow learner requests to add, keep, remove, replace or clear content. Never say you updated the board without calling this tool.',parameters:{type:'object',properties:{action:{type:'string',enum:['add','replace','keep','remove','clear']},type:{type:'string',enum:['phrase','vocabulary','conjugation','pronunciation','tip']},title:{type:'string'},content:{type:'string'}},required:['action'],additionalProperties:false}};
function handleBoardTool(m){if(m.type!=='response.function_call_arguments.done'||m.name!=='update_lesson_board')return;let output='';try{output=updateBoard(JSON.parse(m.arguments||'{}'))}catch(e){output='Board update failed: '+e.message}if(dc?.readyState==='open'){dc.send(JSON.stringify({type:'conversation.item.create',item:{type:'function_call_output',call_id:m.call_id,output}}));dc.send(JSON.stringify({type:'response.create'}))}}

let recoveryMode=new URLSearchParams(location.hash.slice(1)).get('type')==='recovery';
db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){recoveryMode=true;queueMicrotask(()=>render().catch(console.error));}});
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const status=x=>{const e=document.querySelector('#status');if(e)e.textContent=x};
async function render(){
 if(recoveryMode){
  const {data:{session}}=await db.auth.getSession();
  if(!session){app.innerHTML='<main><h1>Reset password</h1><p>This reset link is invalid or has expired. Return to Profe and request a new link.</p><button id="back">Back to sign in</button></main>';document.querySelector('#back').onclick=()=>{recoveryMode=false;history.replaceState(null,'',location.pathname);render()};return;}
  app.innerHTML='<main><h1>Choose a new password</h1><p>Enter a new password for your Profe account.</p><form id="reset"><input type="password" id="newpass" minlength="8" autocomplete="new-password" placeholder="New password (8+ characters)" required><input type="password" id="confirm" minlength="8" autocomplete="new-password" placeholder="Confirm new password" required><button type="submit">Save new password</button></form><p id="status" role="status"></p></main>';
  document.querySelector('#reset').onsubmit=async e=>{e.preventDefault();const password=document.querySelector('#newpass').value;if(password!==document.querySelector('#confirm').value){status('Passwords do not match.');return}const {error}=await db.auth.updateUser({password});if(error){status(error.message);return}recoveryMode=false;history.replaceState(null,'',location.pathname);await db.auth.signOut();await render();status('Password updated. Sign in with your new password.')};return;
 }
 const {data:{user},error:authError}=await db.auth.getUser();
 if(!user){
 app.innerHTML='<main><h1>Profe 🎙️</h1><p>Practical Ecuadorian Spanish, at your pace.</p><form id="auth"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" minlength="6" placeholder="Password" required><div><button type="submit" name="action" value="login">Sign in</button><button type="submit" name="action" value="signup" class="secondary">Create account</button></div></form><button id="forgot" type="button" class="secondary">Forgot password or login email?</button><p id="status" role="status"></p></main>';
 document.querySelector('#forgot').onclick=async()=>{const email=document.querySelector('#email').value.trim()||prompt('Enter the email address used for your Profe account:');if(!email)return;const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)status('Could not request reset: '+error.message);else status('If an account exists for that email, a password reset link will be sent. Check your inbox and spam folder. If you forgot which email you used, check your past Profe confirmation emails or contact support.');};
 document.querySelector('#auth').onsubmit=async e=>{e.preventDefault();const email=document.querySelector('#email').value,password=document.querySelector('#password').value;const signup=e.submitter?.value==='signup';const {error}=signup?await db.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}}):await db.auth.signInWithPassword({email,password});if(error)status(error.message);else if(signup)status('Check your email for confirmation, then sign in.');else await render()};return;
 }
 let {data:p,error}=await db.from('profe_learners').select('*').eq('auth_user_id',user.id).maybeSingle();
 if(error)throw error;
 if(!p){const result=await db.from('profe_learners').insert({auth_user_id:user.id,display_name:user.user_metadata?.name||user.email.split('@')[0],goals:['Practical daily Spanish'],preferences:{support_language:'English when needed'}}).select().single();if(result.error)throw result.error;p=result.data}
 profile=p;
 try{boardItems=JSON.parse(localStorage.getItem('profe-board-'+p.id)||'[]');if(!Array.isArray(boardItems))boardItems=[]}catch{boardItems=[]}
 try{practiceCards=JSON.parse(localStorage.getItem('profe-practice-'+p.id)||'[]');if(!Array.isArray(practiceCards))practiceCards=[]}catch{practiceCards=[]}
 activePhrase='';practiceAttempts=0;
 app.innerHTML='<main><header><h1>Profe 🎙️</h1><p>Hola, '+esc(p.display_name)+'. Ready to practice?</p><button class="secondary" id="rename">Preferred name</button><button class="secondary" id="language">Feedback settings</button><button class="secondary" id="logout">Sign out</button></header><section><button id="start">Start speaking</button><button class="secondary" id="end" disabled>End session</button><p id="status" role="status">Ready.</p><audio id="audio" autoplay></audio><div id="teacher" aria-live="polite"></div><div id="learner"></div></section><section><h2>Your learning plan</h2><p id="lessonplan"></p><div id="practice"><h2>📋 Profe's Lesson Board</h2><div id="boarditems"></div><h3>Current practice phrase</h3><div id="phrase"></div><p id="attempts"></p><input id="customphrase" placeholder="Type or paste a phrase" aria-label="Phrase to practice"><button id="pin" class="secondary" type="button">Pin phrase</button><button id="review" class="secondary" type="button">Review saved phrase</button><small>These are your words to say. They stay here while the live conversation updates above. Practice 3–5 times.</small></div><h3>Recent feedback</h3><p id="progressnotes"></p><small>Transcripts are saved privately. Learning analysis is being introduced progressively.</small></section></main>';
 document.querySelector('#rename').onclick=async()=>{const name=prompt('What should Profe call you?',profile.display_name);if(!name?.trim())return;const clean=name.trim().slice(0,60);const {error}=await db.from('profe_learners').update({display_name:clean,preferences:{...profile.preferences,preferred_name:clean}}).eq('id',profile.id);if(error)status('Could not save name: '+error.message);else{profile.display_name=clean;status('Saved. Profe will call you '+clean+' next session.');document.querySelector('header p').textContent='Hola, '+clean+'. Ready to practice?';}};
 document.querySelector('#language').onclick=async()=>{const english=confirm('Press OK for short English feedback, or Cancel for Spanish feedback.');const preferences={...profile.preferences,feedback_language:english?'English':'Spanish',short_feedback:true};const {error}=await db.from('profe_learners').update({preferences}).eq('id',profile.id);if(error)status('Could not save: '+error.message);else{profile.preferences=preferences;status('Saved for future sessions.')}};
 document.querySelector('#logout').onclick=async()=>{await stop();await db.auth.signOut();await render()};
 document.querySelector('#lessonplan').textContent=profile.next_lesson?.focus||'Review previously practiced phrases, then practice practical Spanish for daily life.';document.querySelector('#progressnotes').textContent=profile.ability_summary?.last_feedback||'Your progress notes will appear here after lesson analysis is enabled.';
 document.querySelector('#pin').onclick=()=>pinPhrase(document.querySelector('#customphrase').value);
 document.querySelector('#review').onclick=()=>{const due=practiceCards.filter(x=>x.attempts>=3).sort((a,b)=>String(a.nextReview||'').localeCompare(String(b.nextReview||'')));if(due.length)pinPhrase(due[0].phrase);else status('Practice a phrase at least 3 times to add it to future reviews.');};
 if(practiceCards.length){const latest=practiceCards[practiceCards.length-1];activePhrase=latest.phrase;practiceAttempts=latest.attempts||0;}else{activePhrase='Disculpe, ¿dónde está la parada de bus?\n¿Puede mostrarme?';practiceAttempts=0;}showPractice();renderBoard();document.querySelector('#start').onclick=start;document.querySelector('#end').onclick=()=>stop();
}
async function start(){
 document.querySelector('#start').disabled=true;log=[];status('Connecting…');
 try{
 const {data:{session}}=await db.auth.getSession();if(!session)throw Error('Please sign in again');
 const {data:s,error}=await db.from('profe_sessions').insert({learner_id:profile.id,topic:'Voice practice'}).select('id').single();if(error)throw error;sessionId=s.id;
 pc=new RTCPeerConnection();pc.ontrack=e=>document.querySelector('#audio').srcObject=e.streams[0];
 mic=await navigator.mediaDevices.getUserMedia({audio:true});mic.getTracks().forEach(t=>pc.addTrack(t,mic));
 dc=pc.createDataChannel('oai-events');dc.onmessage=e=>{try{const m=JSON.parse(e.data);handleBoardTool(m);
 if(m.type==='response.created')document.querySelector('#teacher').textContent='';
 if(m.type==='response.output_audio_transcript.delta')document.querySelector('#teacher').textContent+=m.delta||'';
 if(m.type==='response.output_audio_transcript.done'&&m.transcript){log.push('Profe: '+m.transcript);document.querySelector('#teacher').textContent=m.transcript;const matches=[...m.transcript.matchAll(/[“\"]([^”\"]{5,130})[”\"]/g)].map(x=>x[1]).filter(x=>/[¿¡áéíóúñ]|\b(dónde|puede|disculpe|cuál|cómo|gracias)\b/i.test(x));const unquoted=[...m.transcript.matchAll(/(?:Disculpe,\s*)?¿[^?\n]{5,125}\?/gi)].map(x=>x[0]);const phrases=[...matches,...unquoted];if(phrases.length&&(!activePhrase||practiceAttempts>=3))pinPhrase(phrases[phrases.length-1]);}
 if(m.type==='conversation.item.input_audio_transcription.completed'&&m.transcript){log.push('Learner: '+m.transcript);document.querySelector('#learner').textContent='You: '+m.transcript;noteAttempt(m.transcript)}
 }catch{}};
 dc.onopen=()=>{status('Live. Speak naturally. Ask Profe to slow down whenever needed.');document.querySelector('#end').disabled=false;dc.send(JSON.stringify({type:'session.update',session:{tools:[boardTool],tool_choice:'auto'}}));dc.send(JSON.stringify({type:'response.create'}))};
 pc.onconnectionstatechange=()=>{if(pc?.connectionState==='failed')stop('Connection failed')};
 await pc.setLocalDescription(await pc.createOffer());
 const tokenResponse=await fetch('https://byahpjoizwcwgccufisi.supabase.co/functions/v1/profe-voice-token',{method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_l1IehA77G_uSWEtkqpBj3A_-LIIYv9g',Authorization:'Bearer '+session.access_token},body:'{}'});
 const tokenData=await tokenResponse.json();
 if(!tokenResponse.ok)throw Error(tokenData.error||'Voice token unavailable');
 const response=await fetch('https://api.openai.com/v1/realtime/calls',{method:'POST',headers:{Authorization:'Bearer '+tokenData.client_secret,'Content-Type':'application/sdp'},body:pc.localDescription.sdp});
 if(!response.ok)throw Error('OpenAI voice connection failed ('+response.status+')');
 await pc.setRemoteDescription({type:'answer',sdp:await response.text()});
 }catch(e){await stop('Error: '+e.message)}
}
async function stop(message='Session ended.'){
 if(mic)mic.getTracks().forEach(t=>t.stop());if(dc)dc.close();if(pc)pc.close();mic=dc=pc=null;
 const id=sessionId;sessionId=null;
 if(id){const {error}=await db.from('profe_sessions').update({ended_at:new Date().toISOString(),transcript:log.join('\n')}).eq('id',id);if(error)message+=' Transcript save failed: '+error.message;else if(log.join('').length>60){message+=' Analyzing your practice…';try{const {data:{session}}=await db.auth.getSession();const result=await fetch('https://byahpjoizwcwgccufisi.supabase.co/functions/v1/profe-voice-token',{method:'POST',headers:{'Content-Type':'application/json',apikey:'sb_publishable_l1IehA77G_uSWEtkqpBj3A_-LIIYv9g',Authorization:'Bearer '+session.access_token},body:JSON.stringify({action:'analyze',session_id:id})});const analysis=await result.json();if(!result.ok)message+=' Analysis pending: '+(analysis.error||'Unavailable');else{message='Session saved and analyzed. '+analysis.summary;const plan=document.querySelector('#lessonplan'),notes=document.querySelector('#progressnotes');if(plan)plan.textContent=analysis.next_lesson?.focus||'';if(notes)notes.textContent=analysis.progress?.feedback||''}}catch(e){message+=' Analysis unavailable: '+e.message}}}
 const start=document.querySelector('#start');if(start){start.disabled=false;document.querySelector('#end').disabled=true;status(message)}
}
render().catch(e=>app.innerHTML='<main><h1>Profe</h1><p>'+esc(e.message)+'</p></main>');
</script></body></html>
